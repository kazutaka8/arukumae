  <!-- 横ロゴ：印＋名前＋説明の一行。字はシステムの Hiragino Sans / Noto Sans JP（配る版では字をパスにする） -->
  <g transform="translate(12 12)">
    <rect width="96" height="96" rx="21" fill="#1d232a"/>
    <path d="M19.5 85.5 C 19.5 60 45 66 49.5 46.5 S 66 27 75 21" fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round"/>
    <circle cx="75" cy="21" r="12.75" fill="#b7262a" stroke="#1d232a" stroke-width="5.25"/>
  </g>
  <g font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic UI', sans-serif">
    <text x="132" y="64" font-size="44" font-weight="600" fill="#1d232a" letter-spacing="2">アルクマエ</text>
