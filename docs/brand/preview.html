<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>アルクマエ ロゴの試作（見え方の確認）</title>
<style>
  body { margin: 0; padding: 32px; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; color: #1d232a; background: #fff; }
  h2 { font-size: 14px; color: #677282; font-weight: 600; margin: 28px 0 10px; letter-spacing: 0.04em; }
  .row { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
  .dark { background: #1d232a; padding: 20px; border-radius: 12px; }
  .tab { display: inline-flex; align-items: center; gap: 6px; background: #eef0f3; padding: 6px 12px; border-radius: 8px 8px 0 0; font-size: 12px; color: #444a52; }
  .tab img { width: 16px; height: 16px; }
  figure { margin: 0; text-align: center; font-size: 11px; color: #677282; }
  figure img { display: block; margin: 0 auto 4px; }
  .banner img { width: 100%; max-width: 900px; border: 1px solid #d9dee3; border-radius: 8px; }
</style>
</head>
<body>
<h2>印（かかる筆）：大きさごと</h2>
<div class="row">
  <figure><img src="mark.svg" width="128" height="128"><figcaption>128</figcaption></figure>
  <figure><img src="mark.svg" width="64" height="64"><figcaption>64</figcaption></figure>
  <figure><img src="mark.svg" width="32" height="32"><figcaption>32</figcaption></figure>
  <figure><img src="mark.svg" width="16" height="16"><figcaption>16（favicon）</figcaption></figure>
  <span class="tab"><img src="mark.svg">小川村 県道401号（見本） — アルクマエ</span>
</div>
<h2>印：白地と、対抗の案（区切り）</h2>
<div class="row">
  <figure><img src="mark-light.svg" width="128" height="128"><figcaption>白地 128</figcaption></figure>
  <figure><img src="mark-light.svg" width="32" height="32"><figcaption>32</figcaption></figure>
  <figure><img src="mark-light.svg" width="16" height="16"><figcaption>16</figcaption></figure>
  <figure><img src="mark-alt-segments.svg" width="128" height="128"><figcaption>対抗：区切り 128</figcaption></figure>
  <figure><img src="mark-alt-segments.svg" width="16" height="16"><figcaption>16</figcaption></figure>
</div>
<h2>横ロゴ（白地・濃い地）</h2>
<div class="row">
  <img src="logo-h.svg" width="560" height="120">
</div>
<div class="row dark" style="margin-top:12px"><img src="logo-h-dark.svg" width="560" height="120"></div>
<h2>バナー（1200×630。OGP・GitHub の social preview）</h2>
<div class="banner"><img src="banner.svg"></div>
</body>
</html>
