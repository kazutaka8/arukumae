<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>印の案</title>
<style>body{margin:0;padding:28px;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:#1d232a;background:#fff}
.g{display:grid;grid-template-columns:repeat(5,1fr);gap:24px}figure{margin:0;text-align:center;font-size:12px;color:#677282}
.sizes{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-top:8px}.tab{display:inline-flex;align-items:center;gap:6px;background:#eef0f3;padding:5px 10px;border-radius:8px 8px 0 0;font-size:12px;margin-top:8px}.tab img{width:16px;height:16px}
.dark{background:#1d232a;padding:16px;border-radius:12px;margin-top:20px;display:flex;gap:20px;align-items:center}
.logo{display:flex;align-items:center;gap:14px;font-weight:600;font-size:28px;letter-spacing:2px}.logo img{width:56px}</style></head><body>
<div class="g">
<figure><img src="c-sweep.svg" width="128"><div class="sizes"><img src="c-sweep.svg" width="48"><img src="c-sweep.svg" width="32"><img src="c-sweep.svg" width="16"></div><div class="tab"><img src="c-sweep.svg">アルクマエ</div><figcaption>C 振り出し</figcaption></figure>
<figure><img src="d-segments.svg" width="128"><div class="sizes"><img src="d-segments.svg" width="48"><img src="d-segments.svg" width="32"><img src="d-segments.svg" width="16"></div><div class="tab"><img src="d-segments.svg">アルクマエ</div><figcaption>D 区切り</figcaption></figure>
<figure><img src="e-parcel.svg" width="128"><div class="sizes"><img src="e-parcel.svg" width="48"><img src="e-parcel.svg" width="32"><img src="e-parcel.svg" width="16"></div><div class="tab"><img src="e-parcel.svg">アルクマエ</div><figcaption>E かかる筆</figcaption></figure>
<figure><img src="f-blade.svg" width="128"><div class="sizes"><img src="f-blade.svg" width="48"><img src="f-blade.svg" width="32"><img src="f-blade.svg" width="16"></div><div class="tab"><img src="f-blade.svg">アルクマエ</div><figcaption>F ブレードと道</figcaption></figure>
<figure><img src="g-mono.svg" width="128"><div class="sizes"><img src="g-mono.svg" width="48"><img src="g-mono.svg" width="32"><img src="g-mono.svg" width="16"></div><div class="tab"><img src="g-mono.svg">アルクマエ</div><figcaption>G 「ア」</figcaption></figure>
</div>
<div class="dark"><span class="logo" style="color:#fff"><img src="e-parcel.svg">アルクマエ</span><span class="logo" style="color:#fff"><img src="f-blade.svg">アルクマエ</span><span class="logo" style="color:#fff"><img src="d-segments.svg">アルクマエ</span></div>
<div style="display:flex;gap:20px;margin-top:20px"><span class="logo"><img src="e-parcel.svg">アルクマエ</span><span class="logo"><img src="f-blade.svg">アルクマエ</span><span class="logo"><img src="d-segments.svg">アルクマエ</span></div>
</body></html>
