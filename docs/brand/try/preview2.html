<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>印の案 2</title>
<style>body{margin:0;padding:28px;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:#1d232a;background:#fff}
.g{display:grid;grid-template-columns:repeat(5,1fr);gap:24px}figure{margin:0;text-align:center;font-size:12px;color:#677282}
.sizes{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-top:8px}.tab{display:inline-flex;align-items:center;gap:6px;background:#eef0f3;padding:5px 10px;border-radius:8px 8px 0 0;font-size:12px;margin-top:8px}.tab img{width:16px;height:16px}
.dark{background:#1d232a;padding:16px;border-radius:12px;margin-top:20px;display:flex;gap:28px;align-items:center;color:#fff}
.logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:30px;letter-spacing:3px}.logo img{width:60px}.logo small{display:block;font-size:12px;font-weight:400;letter-spacing:1px;color:#8a94a0;margin-top:2px}
.light{display:flex;gap:28px;margin-top:20px;align-items:center}</style></head><body>
<div class="g">
<figure><img src="e2.svg" width="128"><div class="sizes"><img src="e2.svg" width="48"><img src="e2.svg" width="32"><img src="e2.svg" width="16"></div><div class="tab"><img src="e2.svg">アルクマエ</div><figcaption>E2 かかる筆</figcaption></figure>
<figure><img src="e3.svg" width="128"><div class="sizes"><img src="e3.svg" width="48"><img src="e3.svg" width="32"><img src="e3.svg" width="16"></div><div class="tab"><img src="e3.svg">アルクマエ</div><figcaption>E3 かかる筆（右上）</figcaption></figure>
<figure><img src="e2-light.svg" width="128"><div class="sizes"><img src="e2-light.svg" width="48"><img src="e2-light.svg" width="32"><img src="e2-light.svg" width="16"></div><div class="tab"><img src="e2-light.svg">アルクマエ</div><figcaption>E2 白地</figcaption></figure>
<figure><img src="d2.svg" width="128"><div class="sizes"><img src="d2.svg" width="48"><img src="d2.svg" width="32"><img src="d2.svg" width="16"></div><div class="tab"><img src="d2.svg">アルクマエ</div><figcaption>D2 区切り</figcaption></figure>
<figure><img src="d2-light.svg" width="128"><div class="sizes"><img src="d2-light.svg" width="48"><img src="d2-light.svg" width="32"><img src="d2-light.svg" width="16"></div><div class="tab"><img src="d2-light.svg">アルクマエ</div><figcaption>D2 白地</figcaption></figure>
</div>
<div class="dark"><span class="logo"><img src="e2.svg"><span>アルクマエ<small>輸送路の用地下調べ</small></span></span><span class="logo"><img src="d2.svg"><span>アルクマエ<small>輸送路の用地下調べ</small></span></span></div>
<div class="light"><span class="logo"><img src="e2-light.svg"><span>アルクマエ<small>輸送路の用地下調べ</small></span></span><span class="logo"><img src="d2-light.svg"><span>アルクマエ<small>輸送路の用地下調べ</small></span></span></div>
</body></html>
